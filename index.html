<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#F7F2EE" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1C1C1E" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Doreen OS">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180x180.png">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <title>Doreen's Personal OS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Storage warning (shown only when persistence is unavailable) -->
    <div id="storageWarning" class="storage-warning" style="display:none">
      ⚠️ 当前打开方式无法保存数据。请用 iPhone Safari 的普通标签页打开此链接，或将其「添加到主屏幕」后使用。
    </div>

    <!-- Page containers -->
    <div id="page-today" class="page active"></div>
    <div id="page-projects" class="page"></div>
    <div id="page-schedule" class="page"></div>
    <div id="page-inbox" class="page"></div>
    <div id="page-profile" class="page"></div>

    <!-- Floating + button -->
    <button id="fab" class="fab" aria-label="快速记录">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <path d="M12 5v14M5 12h14"/>
      </svg>
    </button>

    <!-- Quick add modal -->
    <div id="quickAddModal" class="modal-overlay">
      <div class="modal-content quick-add">
        <div class="modal-handle"></div>
        <h3 class="modal-title">快速记录</h3>
        <div class="quick-add-options">
          <button class="qa-option" data-type="task">
            <span class="qa-icon" style="background:#E8A598">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M9 11l3 3L22 4M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
            </span>
            <span class="qa-label">新任务</span>
          </button>
          <button class="qa-option" data-type="inspiration">
            <span class="qa-icon" style="background:#D4B896">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M12 2v0M12 2a7 7 0 00-4 12.7V17a1 1 0 001 1h6a1 1 0 001-1v-2.3A7 7 0 0012 2zM9 21h6"/></svg>
            </span>
            <span class="qa-label">新灵感</span>
          </button>
          <button class="qa-option" data-type="note">
            <span class="qa-icon" style="background:#8BA5B8">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>
            </span>
            <span class="qa-label">新笔记</span>
          </button>
          <button class="qa-option" data-type="schedule">
            <span class="qa-icon" style="background:#A3B5A0">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
            </span>
            <span class="qa-label">新日程</span>
          </button>
        </div>
        <div class="quick-add-input">
          <input type="text" id="quickAddText" placeholder="输入内容，选择类型后回车..." maxlength="200">
          <select id="quickAddDomain">
            <option value="schedule">日程</option>
            <option value="reading">阅读</option>
            <option value="learning">学习</option>
            <option value="personal">个人生活</option>
            <option value="period">生理期</option>
            <option value="exercise">运动</option>
          </select>
        </div>
        <button class="btn-primary" id="quickAddSubmit">添加到收集箱</button>
        <button class="btn-text" id="quickAddClose">取消</button>
      </div>
    </div>

    <!-- Generic Form Modal -->
    <div id="formModal" class="modal-overlay">
      <div class="modal-content form-modal">
        <div class="modal-handle"></div>
        <h3 class="modal-title" id="formModalTitle">编辑</h3>
        <div id="formModalBody" class="form-modal-body"></div>
        <button class="btn-primary" id="formModalSave">保存</button>
        <button class="btn-text" id="formModalCancel">取消</button>
      </div>
    </div>

    <!-- Avatar upload: hidden file input + confirm modal -->
    <input type="file" id="avatarInput" accept="image/*" style="display:none">
    <div id="avatarModal" class="modal-overlay">
      <div class="modal-content avatar-modal">
        <div class="modal-handle"></div>
        <h3 class="modal-title">更换头像</h3>
        <div class="avatar-preview-wrap">
          <img id="avatarPreview" class="avatar-preview" alt="preview" style="display:none">
        </div>
        <div class="avatar-modal-actions">
          <button class="btn-primary" id="avatarSaveBtn">保存</button>
          <button class="btn-text" id="avatarCancelBtn">取消</button>
          <button class="btn-text avatar-remove" id="avatarRemoveBtn">移除头像</button>
        </div>
      </div>
    </div>

    <!-- AI Deep Analysis Modal -->
    <div id="analysisModal" class="modal-overlay">
      <div class="modal-content analysis-modal">
        <div class="modal-handle"></div>
        <h3 class="modal-title">AI 深度分析</h3>
        <div class="analysis-tag">规则引擎 · 基于你的真实数据</div>
        <div id="analysisBody" class="analysis-body"></div>
        <div class="analysis-actions">
          <button class="ai-brief-btn secondary" id="analysisReBtn">重新分析</button>
          <button class="btn-primary" id="analysisCloseBtn">完成</button>
        </div>
      </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <!-- Bottom Tab Bar -->
    <nav id="tabBar" class="tab-bar">
      <button class="tab-item active" data-tab="today">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
        </svg>
        <span class="tab-label">今日</span>
      </button>
      <button class="tab-item" data-tab="projects">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
        </svg>
        <span class="tab-label">项目</span>
      </button>
      <button class="tab-item" data-tab="schedule">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2.5"/><path d="M16 2v4M8 2v4M3 10h18M8 14h2M14 14h2M8 18h2M14 18h2"/>
        </svg>
        <span class="tab-label">日程</span>
      </button>
      <button class="tab-item" data-tab="inbox">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11L2 12v6a2 2 0 002 2h16a2 2 0 002-2v-6l-3.45-6.89A2 2 0 0016.76 4H7.24a2 2 0 00-1.79 1.11z"/>
        </svg>
        <span class="tab-label">收集箱</span>
        <span class="tab-badge" id="inboxBadge" style="display:none">0</span>
      </button>
      <button class="tab-item" data-tab="profile">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 016-6h4a6 6 0 016 6v1"/>
        </svg>
        <span class="tab-label">我的</span>
      </button>
    </nav>
  </div>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((reg) => console.log('[PWA] SW registered:', reg.scope))
          .catch((err) => console.warn('[PWA] SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
