    <path d="M54 42 Q58 40 62 42" fill="none" stroke="#5A4E47" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Eyes -->
    <circle cx="42" cy="47" r="2.2" fill="#3E3B38"/>
